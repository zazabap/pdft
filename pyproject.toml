[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdft"
version = "0.2.3"
description = "Python port of ParametricDFT.jl: learning parametric quantum Fourier transforms via manifold optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "zazabap" }]
keywords = ["quantum", "dft", "fourier", "variational", "manifold-optimization", "jax"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.10.0",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6,<0.17",
    "numpy>=1.26",
    "jaxtyping>=0.2",
    "matplotlib>=3.8",
]
plot = ["matplotlib>=3.8"]
gpu = ["jax[cuda12]>=0.10.0"]

[project.urls]
Homepage = "https://github.com/zazabap/pdft"
Issues = "https://github.com/zazabap/pdft/issues"
Upstream = "https://github.com/nzy1997/ParametricDFT.jl"

[tool.hatch.build.targets.wheel]
packages = ["src/pdft"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Declared deliberately, because ruff's *default* rule set widens between
# releases. With no `select` here and an unpinned `ruff>=0.5` in [dev], lint
# was a property of the release calendar rather than of the repository: CI
# went red on `main` with no source change when a newer ruff turned on rules
# 0.5 did not have (RUF100, I001, C408, B008, ...).
#
# This set is pyflakes + import order + pyupgrade + comprehensions: the rules
# that catch real defects, all of which the codebase already satisfies.
select = ["E4", "E7", "E9", "F", "I", "UP", "C4"]

# The package configures jax x64 mode before importing anything that reads it,
# which is a module-level import after a statement by construction. This is
# what the scattered `# noqa: E402` comments were for; ignoring the rule once
# here is the same intent without directives that later ruff versions then
# flag as unused.
ignore = ["E402"]

# Not enabled, but each is a reasonable thing to opt into later:
#   "B"   -> 24 findings, almost all `zip()` without `strict=`
#   "RUF" -> 40 findings, mostly ambiguous-unicode in maths docstrings where
#            the multiplication sign is intended, so it needs per-site review

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:jax.*",
]
markers = [
    "parity: byte-compare against Julia-generated goldens (slower; deselect with -m 'not parity')",
    "slow: long-running tests (>30s); deselect with -m 'not slow' for fast iteration",
]
